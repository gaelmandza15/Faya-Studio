[package]
name = "tauri-v2-sqlite"
version = "0.1.0"
description = "Faya-Studio generated Tauri application"
authors = ["Faya-Studio"]
edition = "2024"

[lib]
name = "tauri_v2_sqlite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
